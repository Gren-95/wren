name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install dependencies
        run: |
          dnf install -y cargo rust clippy rustfmt git gtk4-devel libadwaita-devel \
            gcc pkgconf-pkg-config xorg-x11-server-Xvfb xorg-x11-xauth mesa-dri-drivers

      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build
        run: cargo build --release --locked

      - name: Clippy
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Test
        run: xvfb-run -a cargo test --release --locked
